<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="ステージ泊は現在、公開に向けて準備中です。">
  <title>準備中｜ステージ泊</title>
  <style>
    :root {
      color-scheme: light;
      --text: #21191d;
      --muted: #6d6268;
      --accent: #df3f80;
      --soft: #fff2f7;
      --line: #efd6e0;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, #fff 0%, #fff8fb 100%);
      color: var(--text);
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    }

    main {
      width: min(100%, 560px);
      padding: clamp(32px, 8vw, 56px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 18px 55px rgba(88, 46, 67, .1);
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 34px;
      font-weight: 900;
      font-size: 20px;
    }

    .mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 13px 13px 13px 4px;
      background: var(--accent);
      color: #fff;
      font: italic 27px Georgia, serif;
    }

    .accent { color: var(--accent); }

    .status {
      display: inline-block;
      margin: 0 0 14px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--soft);
      color: #b72763;
      font-size: 13px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 44px);
      line-height: 1.35;
      letter-spacing: 0;
    }

    p {
      margin: 20px auto 0;
      color: var(--muted);
      line-height: 1.9;
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      main { padding: 34px 22px; border-radius: 16px; }
      .brand { margin-bottom: 28px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">S</span><span>ステージ<span class="accent">泊</span></span></div>
    <p class="status">COMING SOON</p>
    <h1>ただいま準備中です</h1>
    <p>より使いやすい観劇遠征ホテルガイドとして公開するため、掲載内容を整えています。</p>
  </main>
</body>
</html>
