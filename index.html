<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>mainitiworakunisuru.com</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8f6f0;
      --text: #1e1b16;
      --muted: #6f675e;
      --line: #ded8cd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100% - 32px, 640px);
      padding: 40px 0;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fffdf8;
      padding: clamp(24px, 6vw, 48px);
      box-shadow: 0 20px 60px rgba(31, 26, 18, 0.08);
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(1.8rem, 6vw, 3rem);
      line-height: 1.2;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-label="準備中">
      <h1>新しいサイトを準備中です</h1>
      <p>mainitiworakunisuru.com は現在、新しい内容へ切り替え作業中です。</p>
    </section>
  </main>
</body>
</html>
