<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>サイト準備中</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      color: #171717;
      background: #f7f7f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 560px);
      padding: 48px 32px;
      border: 1px solid #deded9;
      border-radius: 8px;
      background: #ffffff;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      line-height: 1.35;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #61615d;
      font-size: 1rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main>
    <h1>サイト準備中</h1>
    <p>新しいサイトを準備しています。</p>
  </main>
</body>
</html>
